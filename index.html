<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чингэлтэй дүүргийн хүн ам ба нийгмийн тэгш байдал</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E7;--ink:#14282B;--mut:#6B7A78;--card:#EDE6D6;--ac:#D9553B;--te:#1F6F6B;--ln:#D8CFBB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1B1D;--ink:#EFE9DC;--mut:#93A5A2;--card:#172A2D;--ac:#F07A5E;--te:#5CC2B8;--ln:#27403F}}
:root[data-theme="dark"]{--bg:#0E1B1D;--ink:#EFE9DC;--mut:#93A5A2;--card:#172A2D;--ac:#F07A5E;--te:#5CC2B8;--ln:#27403F}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header,footer{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(18px,5vw,64px);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
#k{color:var(--ac);font-weight:600}
main{flex:1;position:relative;min-height:0}
.s{position:absolute;inset:0;padding:0 clamp(18px,5vw,64px);display:none;flex-direction:column;justify-content:center;overflow-y:auto;animation:in .45s ease}
.s.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:800;line-height:1.1;margin:0 0 .5em;max-width:18em}
h1{font-size:clamp(30px,5.2vw,64px)}h2{font-size:clamp(26px,4.4vw,52px)}
em{color:var(--ac);font-style:italic;font-weight:600}
p.sub{font-size:clamp(15px,1.8vw,21px);color:var(--mut);max-width:34em;margin:0 0 1em;line-height:1.5}
.g{display:grid;gap:clamp(10px,2vw,22px);grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:.6em}
.c{background:var(--card);border-left:4px solid var(--te);padding:clamp(14px,2vw,26px);border-radius:4px}
.c b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:clamp(30px,5vw,60px);color:var(--ac);line-height:1.05;margin-bottom:.25em}
.c span{font-size:clamp(13px,1.5vw,17px);line-height:1.4}
ul.l{list-style:none;padding:0;margin:0;max-width:40em}
ul.l li{padding:.7em 0;border-bottom:1px solid var(--ln);font-size:clamp(16px,2vw,24px);display:flex;gap:1em}
ul.l li i{font-style:normal;color:var(--ac);font-weight:600;min-width:1.6em}
.bar{display:grid;grid-template-columns:minmax(70px,10em) 1fr 5.5em;gap:12px;align-items:center;margin:.55em 0;max-width:46em;font-size:clamp(14px,1.7vw,20px)}
.bar div.t{background:var(--card);height:30px;border-radius:3px;overflow:hidden}
.bar div.t div{height:100%;background:var(--te);width:0;transition:width 1s ease}
.bar.hi div.t div{background:var(--ac)}.bar b{text-align:right}
.sp{display:flex;height:64px;max-width:46em;margin:1em 0;border-radius:4px;overflow:hidden;font-weight:600;color:#fff}
.sp div{display:flex;align-items:center;justify-content:center;font-size:clamp(13px,1.8vw,20px);padding:0 8px;text-align:center}
.q{border-left:4px solid var(--ac);padding-left:18px;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:clamp(18px,2.6vw,30px);max-width:26em;margin-top:1em;line-height:1.35}
.note{font-size:clamp(13px,1.5vw,17px);color:var(--mut);margin-top:1em;max-width:44em;line-height:1.5}
.btn{font:inherit;background:var(--ink);color:var(--bg);border:0;padding:12px 22px;border-radius:30px;cursor:pointer;font-weight:600;align-self:flex-start;margin-top:.8em}
.rv{display:none}.s.rvd .rv{display:block;animation:in .5s ease}.s.rvd .btn{display:none}
.ch{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-top:1em}
.ch .c{flex:1 1 130px;border-left:0;border-top:4px solid var(--ac)}.ch .c span{font-weight:600;font-size:clamp(14px,1.8vw,20px)}
nav{display:flex;gap:8px}nav button{font:inherit;width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:transparent;color:var(--ink);cursor:pointer;font-size:16px}
#pg{height:3px;background:var(--ac);width:0;transition:width .4s}
#hint{font-size:11px}

.end-reel{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:4vw;width:100%}
.end-copy{display:flex;flex-direction:column;gap:14px}
.end-media{position:relative;display:flex;justify-content:center;align-items:center}
.end-video{width:min(32vw,390px);height:min(68vh,580px);object-fit:cover;border-radius:28px;box-shadow:0 24px 58px rgba(0,0,0,.28);background:#0f1b2a}
.sound-btn{position:absolute;right:10px;bottom:10px;border:0;border-radius:999px;padding:10px 15px;background:rgba(15,27,42,.84);color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
@media(max-width:760px){.end-reel{grid-template-columns:1fr;gap:18px;text-align:center}.end-copy{align-items:center}.end-media{order:-1}.end-video{width:min(62vw,320px);height:min(46vh,430px)}}
@media(max-width:560px){#hint{display:none}.bar{grid-template-columns:70px 1fr 4.5em}}
</style></head><body>
<header><span id="k"></span><span id="n"></span></header>
<main id="m"></main>
<div id="pg"></div>
<footer><span id="hint">← → · Хоосон зай</span><span>Чингэлтэй · Тэгш байдал</span><nav><button id="pv" aria-label="Өмнөх">←</button><button id="nx" aria-label="Дараах">→</button></nav></footer>
<script>
var B=function(r,mx,hi){return r.map(function(x){return '<div class="bar'+(hi&&x[3]?' hi':'')+'"><span>'+x[0]+'</span><div class="t"><div data-w="'+(x[1]/mx*100)+'"></div></div><b>'+x[2]+'</b></div>'}).join('')};
var G=function(a){return '<div class="g">'+a.map(function(x){return '<div class="c"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('')+'</div>'};
var L=function(a){return '<ul class="l">'+a.map(function(x,i){return '<li><i>0'+(i+1)+'</i><span>'+x+'</span></li>'}).join('')+'</ul>'};
var SP=function(a){return '<div class="sp">'+a.map(function(x){return '<div style="flex:'+x[1]+';background:'+x[2]+'">'+x[0]+'</div>'}).join('')+'</div>'};
var N=function(t){return '<p class="note">'+t+'</p>'};
var Q=function(t){return '<div class="q">'+t+'</div>'};
var T='var(--te)',A='var(--ac)';
var S=[
['Нүүр','<h1>Чингэлтэй дүүргийн хүн ам ба нийгмийн <em>тэгш байдал</em></h1><p class="sub">Хүн амын бүтэц, боловсрол, хөдөлмөр эрхлэлт, нийгмийн боломж · 2024 оны статистик</p>'],
['Агуулга','<h2><em>Агуулга</em></h2>'+L(['Хүн амын бүтэц','Боловсрол ба тэгш боломж','Хөдөлмөр эрхлэлт ба хүйс','Ажил, орлого, амьжиргаа','Нийгмийн хамгаалал','Нэгдсэн дүгнэлт'])],
['Судалгааны мэдээлэл',G([['2024','Нийслэлийн Чингэлтэй дүүргийн статистик'],['2020','Хүн ам, орон сууцны тооллого (1212.mn)'],['≈','Хөдөлмөрийн насны хүн ам нь тооцоолол']])],
['1 · Хүн ам','<h2>Дүүргийн <em>хүн ам</em></h2>'+G([['133,044','хүн ам'],['36,857','өрх']])],
['1 · Хүн ам','<h2>Хүйсийн <em>бүтэц</em></h2>'+SP([['Эрэгтэй 65,146 · 49%',49,T],['Эмэгтэй 67,898 · 51%',51,A]])+Q('Хүйсийн тоо тэнцүү ≠ боломж тэнцүү.')],
['1 · Хүн ам','<h2>Насны <em>ангилал</em></h2>'+B([['0–14',39329,'29.6%'],['15–34',35898,'27%'],['35–54',36678,'27.6%'],['55+',21139,'15.9%']],40000)],
['1 · Хүн ам','<h2>Хөдөлмөрийн насны <em>хүн ам</em></h2>'+G([['56.3','хүн амын ачаалал: хөдөлмөрийн насны 100 хүнд ногдох хүүхэд, өндөр настан'],['≈ 85.1 мянга','15–64 насны хүн ам']])],
['2 · Боловсрол','<h2>ЕБС-ийн <em>сурагчид</em></h2>'+G([['30,229','2023–2024 оны хичээлийн жилийн ЕБС-д суралцагч']])],
['2 · Боловсрол','<h2>Охид, хөвгүүд <em>ижил</em> хамрагдсан</h2>'+SP([['Эрэгтэй 15,118',15118,T],['Эмэгтэй 15,111',15111,A]])],
['2 · Боловсрол','<h2>Сургуулийн <em>өмнөх</em> боловсрол</h2>'+G([['51','цэцэрлэг'],['10,251','хүүхэд хамрагдсан']])],
['2 · Боловсрол','<h2>Тоо <em>чанарыг</em> харуулдаггүй</h2>'+L(['Сургалтын чанар','Сургуулийн байршил, ангийн дүүргэлт','Гэр бүлийн орлого','Нэмэлт сургалтад хамрагдах боломж'])+Q('Боловсролын тэгш хүртээмж нь ирээдүйн хөдөлмөр эрхлэлт, орлогын суурь юм.')],
['3 · Хөдөлмөр','<h2>Ажиллах хүчний <em>оролцоо</em></h2>'+G([['53.7%','дүүргийн нийт'],['59.0%','эрэгтэй'],['48.8%','эмэгтэй']])+N('Эх сурвалж: 2020 оны Хүн ам, орон сууцны тооллого.')],
['3 · Хөдөлмөр','<h2><em>10.2</em> нэгж хувийн зөрүү</h2>'+B([['Эрэгтэй',59,'59.0%'],['Эмэгтэй',48.8,'48.8%',1]],60,1)],
['3 · Хөдөлмөр','<h2>Хөдөлмөрийн зах зээлд <em>оролцоогүй</em> хүн ам</h2>'+B([['Нийт',46.3,'46.3%'],['Эрэгтэй',41,'41.0%'],['Эмэгтэй',51.2,'51.2%',1]],60,1)],
['3 · Хөдөлмөр','<h2>Зөрүүг юу <em>тайлбарлаж</em> болох вэ?</h2>'+G([['01','Суралцах байдал'],['02','Хүүхэд асрах үүрэг'],['03','Гэр бүлийн нөхцөл'],['04','Зах зээлийн бүтэц']])],
['4 · Орлого','<h2>Ажил → <em>орлого</em> → хэрэгцээ</h2>'+L(['Ажил эрхлэлт нь орлого олох боломжийг бий болгоно','Орлого нь хоол хүнс, орон байр, боловсрол, эрүүл мэндийн хэрэгцээг хангана'])],
['4 · Орлого','<h2>Үнийн өсөлт <em>8.0%</em></h2><p class="sub">2024 оны 5-р сар, өмнөх оны мөн үеэс. Хэрэглээний бараа, үйлчилгээний үнэ.</p>'+Q('Орлого багатай өрхөд дарамт илүү мэдрэгдэнэ.')],
['4 · Орлого','<h2>Боломжийн <em>гинж</em></h2><div class="ch">'+['Боловсрол','Хөдөлмөр эрхлэлт','Орлого','Хэрэглээ','Амьдралын чанар'].map(function(x){return '<div class="c"><span>'+x+'</span></div>'}).join('')+'</div>'],
['5 · Хамгаалал','<h2>Нийгмийн <em>халамж</em></h2>'+L(['Бие даан амьдрахад хүндрэлтэй иргэдийн наад захын хэрэгцээг хангана','2024 оны эхний 5 сард олон мянган иргэнийг хамарсан'])],
['5 · Хамгаалал','<h2><em>Equality</em> ба Equity</h2><div class="g"><div class="c"><b style="color:var(--mut)">=</b><span><strong>Equality.</strong> Хүн бүрт яг ижил зүйл өгнө.</span></div><div class="c" style="border-color:var(--ac)"><b>≠</b><span><strong>Equity.</strong> Хэрэгцээ нь ялгаатай хүнд шаардлагатай дэмжлэг үзүүлж, ижил боломжид хүргэнэ.</span></div></div>'],
['5 · Хамгаалал','<h2>Тэгш бус байдал нь зөвхөн <em>хүйсээр</em> хэмжигддэггүй</h2>'+G([['55+','Өндөр настан'],['0–14','Хүүхэд'],['♿','Хөгжлийн бэрхшээлтэй хүн'],['₮','Орлого багатай өрх']])],
['6 · Дүгнэлт','<h2>Тоо <em>тэнцүү</em>. Боломж?</h2>'+L(['Хүйсийн харьцаа 49:51, ЕБС-ийн охид, хөвгүүд ч бараг ижил','Ажиллах хүчний оролцоонд 10.2 нэгж хувийн ялгаа (2020)','Боловсролын чанар, орлого, хэрэглээ, хамгаалал нь боломжид нөлөөлнө'])],
['6 · Дүгнэлт','<h2>Цаашдын <em>судалгаа</em></h2>'+L(['Хүүхэд асрах ачааллыг тусад нь шалгах','Ажлын байрны бүтцийг хүйсээр харьцуулах','Дүүргийн ажилгүйдэл, ядуурлын шинэ өгөгдөл олох'])],
['Багийн гишүүд','<h2>Багийн <em>гишүүд</em></h2>'+L(['Б.Сундуйбазар · B261910006','Б.Маналсүрэн · B261890073','Б.Сарнай · B261890021','Б.Эрдэнэбаяр · B251930036','Т.Нямхүү · B262230089','Д.Цэнгэл · B210920030'])],
['Төгсгөл','<div class="end-reel"><div class="end-copy"><h1><em>Баярлалаа</em></h1><p class="sub">Тэгш байдал гэдэг нь зөвхөн хүйсийн тоо тэнцүү байх бус, боломж хүн бүрт хүртээмжтэй байхыг хэлнэ.</p><p class="note">Эх сурвалж: Нийслэлийн Чингэлтэй дүүрэг, 2024 · 1212.mn, 2020 оны тооллого</p></div><div class="end-media"><video id="endVideo" class="end-video" autoplay muted loop playsinline preload="auto" poster="cute_dance_poster.jpg"><source src="cute_dance_final_with_sound.mp4" type="video/mp4"></video><button id="soundBtn" class="sound-btn" onclick="var v=document.getElementById(\'endVideo\');v.muted=!v.muted;v.volume=1;v.play();this.textContent=v.muted?\'🔇 Дуу\':\'🔊 Дуу\';">🔊 Дуу</button></div></div>']
];
var m=document.getElementById('m'),i=0;
S.forEach(function(s,j){var d=document.createElement('section');d.className='s';d.innerHTML=s[1];m.appendChild(d)});
var D=m.children;
function go(n){i=Math.max(0,Math.min(S.length-1,n));for(var j=0;j<D.length;j++)D[j].classList.toggle('on',j==i);
document.getElementById('k').textContent=S[i][0];document.getElementById('n').textContent=('0'+(i+1)).slice(-2)+' / '+S.length;
document.getElementById('pg').style.width=((i+1)/S.length*100)+'%';
setTimeout(function(){D[i].querySelectorAll('[data-w]').forEach(function(e){e.style.width=e.dataset.w+'%'})},60);
try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
function tryEndSound(){var v=document.getElementById('endVideo');if(!v)return;v.muted=false;v.volume=1;var p=v.play();if(p&&p.catch)p.catch(function(){v.muted=true;v.play()})}
document.getElementById('pv').onclick=function(){go(i-1);tryEndSound()};document.getElementById('nx').onclick=function(){go(i+1);tryEndSound()};
document.addEventListener('keydown',function(e){if(e.key=='ArrowRight'||e.key==' '||e.key=='PageDown'){e.preventDefault();go(i+1)}if(e.key=='ArrowLeft'||e.key=='PageUp')go(i-1)});
var x0=null;m.addEventListener('touchstart',function(e){x0=e.touches[0].clientX});
m.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(i+(d<0?1:-1));x0=null});
go((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
