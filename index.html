<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Чингэлтэй дүүргийн хүн ам ба нийгмийн тэгш байдал</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f1e7;
        --ink: #14282b;
        --mut: #6b7a78;
        --card: #ede6d6;
        --ac: #d9553b;
        --te: #1f6f6b;
        --ln: #d8cfbb;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1b1d;
          --ink: #efe9dc;
          --mut: #93a5a2;
          --card: #172a2d;
          --ac: #f07a5e;
          --te: #5cc2b8;
          --ln: #27403f;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1b1d;
        --ink: #efe9dc;
        --mut: #93a5a2;
        --card: #172a2d;
        --ac: #f07a5e;
        --te: #5cc2b8;
        --ln: #27403f;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, system-ui, "Segoe UI", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header,
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px clamp(18px, 5vw, 64px);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mut);
      }
      #k {
        color: var(--ac);
        font-weight: 600;
      }
      main {
        flex: 1;
        position: relative;
        min-height: 0;
      }
      .s {
        position: absolute;
        inset: 0;
        padding: 0 clamp(18px, 5vw, 64px);
        display: none;
        flex-direction: column;
        justify-content: center;
        overflow-y: auto;
        animation: in 0.45s ease;
      }
      .s.on {
        display: flex;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      h1,
      h2 {
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 800;
        line-height: 1.1;
        margin: 0 0 0.5em;
        max-width: 18em;
      }
      h1 {
        font-size: clamp(30px, 5.2vw, 64px);
      }
      h2 {
        font-size: clamp(26px, 4.4vw, 52px);
      }
      em {
        color: var(--ac);
        font-style: italic;
        font-weight: 600;
      }
      p.sub {
        font-size: clamp(15px, 1.8vw, 21px);
        color: var(--mut);
        max-width: 34em;
        margin: 0 0 1em;
        line-height: 1.5;
      }
      .g {
        display: grid;
        gap: clamp(10px, 2vw, 22px);
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        margin-top: 0.6em;
      }
      .c {
        background: var(--card);
        border-left: 4px solid var(--te);
        padding: clamp(14px, 2vw, 26px);
        border-radius: 4px;
      }
      .c b {
        display: block;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(30px, 5vw, 60px);
        color: var(--ac);
        line-height: 1.05;
        margin-bottom: 0.25em;
      }
      .c span {
        font-size: clamp(13px, 1.5vw, 17px);
        line-height: 1.4;
      }
      ul.l {
        list-style: none;
        padding: 0;
        margin: 0;
        max-width: 40em;
      }
      ul.l li {
        padding: 0.7em 0;
        border-bottom: 1px solid var(--ln);
        font-size: clamp(16px, 2vw, 24px);
        display: flex;
        gap: 1em;
      }
      ul.l li i {
        font-style: normal;
        color: var(--ac);
        font-weight: 600;
        min-width: 1.6em;
      }
      .bar {
        display: grid;
        grid-template-columns: minmax(70px, 10em) 1fr 5.5em;
        gap: 12px;
        align-items: center;
        margin: 0.55em 0;
        max-width: 46em;
        font-size: clamp(14px, 1.7vw, 20px);
      }
      .bar div.t {
        background: var(--card);
        height: 30px;
        border-radius: 3px;
        overflow: hidden;
      }
      .bar div.t div {
        height: 100%;
        background: var(--te);
        width: 0;
        transition: width 1s ease;
      }
      .bar.hi div.t div {
        background: var(--ac);
      }
      .bar b {
        text-align: right;
      }
      .sp {
        display: flex;
        height: 64px;
        max-width: 46em;
        margin: 1em 0;
        border-radius: 4px;
        overflow: hidden;
        font-weight: 600;
        color: #fff;
      }
      .sp div {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(13px, 1.8vw, 20px);
        padding: 0 8px;
        text-align: center;
      }
      .q {
        border-left: 4px solid var(--ac);
        padding-left: 18px;
        font-family: "Playfair Display", Georgia, serif;
        font-style: italic;
        font-size: clamp(18px, 2.6vw, 30px);
        max-width: 26em;
        margin-top: 1em;
        line-height: 1.35;
      }
      .note {
        font-size: clamp(13px, 1.5vw, 17px);
        color: var(--mut);
        margin-top: 1em;
        max-width: 44em;
        line-height: 1.5;
      }
      nav {
        display: flex;
        gap: 8px;
      }
      nav button {
        font: inherit;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--ln);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font-size: 16px;
      }
      #pg {
        height: 3px;
        background: var(--ac);
        width: 0;
        transition: width 0.4s;
      }
      #hint {
        font-size: 11px;
      }
      .end-reel {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        align-items: center;
        gap: 4vw;
        width: 100%;
      }
      .end-copy {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .end-media {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .end-video {
        width: min(32vw, 390px);
        height: min(68vh, 580px);
        object-fit: cover;
        border-radius: 28px;
        box-shadow: 0 24px 58px rgba(0, 0, 0, 0.28);
        background: #0f1b2a;
      }
      .sound-btn {
        position: absolute;
        right: 10px;
        bottom: 10px;
        border: 0;
        border-radius: 999px;
        padding: 10px 15px;
        background: rgba(15, 27, 42, 0.84);
        color: #fff;
        font:
          600 14px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
      }
      @media (max-width: 760px) {
        .end-reel {
          grid-template-columns: 1fr;
          gap: 18px;
          text-align: center;
        }
        .end-copy {
          align-items: center;
        }
        .end-media {
          order: -1;
        }
        .end-video {
          width: min(62vw, 320px);
          height: min(46vh, 430px);
        }
      }
      @media (max-width: 560px) {
        #hint {
          display: none;
        }
        .bar {
          grid-template-columns: 70px 1fr 4.5em;
        }
      }
    </style>
  </head>
  <body>
    <header><span id="k"></span><span id="n"></span></header>
    <main id="m"></main>
    <div id="pg"></div>
    <footer>
      <span id="hint">← →</span><span>Чингэлтэй · Тэгш байдал</span>
      <nav>
        <button id="pv" aria-label="Өмнөх">←</button
        ><button id="nx" aria-label="Дараах">→</button>
      </nav>
    </footer>
    <script>
      var B = function (r, mx, hi) {
        return r
          .map(function (x) {
            return (
              '<div class="bar' +
              (hi && x[3] ? " hi" : "") +
              '"><span>' +
              x[0] +
              '</span><div class="t"><div data-w="' +
              (x[1] / mx) * 100 +
              '"></div></div><b>' +
              x[2] +
              "</b></div>"
            );
          })
          .join("");
      };
      var G = function (a) {
        return (
          '<div class="g">' +
          a
            .map(function (x) {
              return (
                '<div class="c"><b>' +
                x[0] +
                "</b><span>" +
                x[1] +
                "</span></div>"
              );
            })
            .join("") +
          "</div>"
        );
      };
      var L = function (a) {
        return (
          '<ul class="l">' +
          a
            .map(function (x, i) {
              return "<li><i>0" + (i + 1) + "</i><span>" + x + "</span></li>";
            })
            .join("") +
          "</ul>"
        );
      };
      var SP = function (a) {
        return (
          '<div class="sp">' +
          a
            .map(function (x) {
              return (
                '<div style="flex:' +
                x[1] +
                ";background:" +
                x[2] +
                '">' +
                x[0] +
                "</div>"
              );
            })
            .join("") +
          "</div>"
        );
      };
      var N = function (t) {
        return '<p class="note">' + t + "</p>";
      };
      var Q = function (t) {
        return '<div class="q">' + t + "</div>";
      };
      var T = "var(--te)",
        A = "var(--ac)";
      var S = [
        [
          "Нүүр",
          '<h1>Чингэлтэй дүүргийн хүн ам ба нийгмийн <em>тэгш байдал</em></h1><p class="sub">Хүн ам, боловсрол, эмнэлгийн үйлчилгээ, ажил эрхлэлтийг тэгш байдлын өнцгөөс нь харлаа · 2024 оны статистик</p>',
        ],
        [
          "Агуулга",
          "<h2><em>Агуулга</em></h2>" +
            L([
              "Дүүрэгт хэдэн хүн амьдардаг вэ?",
              "Боловсрол хүн бүрт адил байна уу?",
              "Эмнэлгийн үйлчилгээ хүн бүрт хүрч байна уу?",
              "Ажил эрхлэлт ба хүйс",
              "Орлого, үнэ ба тэгш байдал",
              "Эцсийн дүгнэлт",
            ]),
        ],
        [
          "Судалгааны мэдээлэл",
          G([
            ["2024", "Чингэлтэй дүүргийн статистикийн мэдээлэл"],
            ["2020", "Хүн ам, орон сууцны тооллого (1212.mn)"],
            ["≈", "Зарим тоог ойролцоогоор тооцсон"],
          ]),
        ],
        [
          "1 · Хүн ам",
          "<h2>Чингэлтэйд хэдэн хүн <em>амьдардаг</em> вэ?</h2>" +
            G([
              ["133,044", "хүн амьдарч байна"],
              ["36,857", "өрх"],
            ]),
        ],
        [
          "1 · Хүн ам",
          "<h2>Эрэгтэй, эмэгтэй хүний <em>харьцаа</em></h2>" +
            SP([
              ["Эрэгтэй 65,146 · 49%", 49, T],
              ["Эмэгтэй 67,898 · 51%", 51, A],
            ]) +
            Q("Хүйсийн тоо тэнцүү байгаа нь боломж ч тэнцүү гэсэн үг биш."),
        ],
        [
          "1 · Хүн ам",
          "<h2>Ямар насныхан <em>олон</em> бэ?</h2>" +
            B(
              [
                ["0–14", 39329, "29.6%"],
                ["15–34", 35898, "27%"],
                ["35–54", 36678, "27.6%"],
                ["55+", 21139, "15.9%"],
              ],
              40000,
            ),
        ],
        [
          "2 · Боловсрол",
          "<h2>ЕБС-д хичээллэж байгаа <em>хүүхэд</em></h2>" +
            G([
              ["30,229", "хүүхэд 2023–2024 оны хичээлийн жилд ЕБС-д суралцсан"],
            ]),
        ],
        [
          "2 · Боловсрол",
          "<h2>Охид, хөвгүүд сургуульд <em>адил</em> хамрагдаж байна</h2>" +
            SP([
              ["Эрэгтэй 15,118", 15118, T],
              ["Эмэгтэй 15,111", 15111, A],
            ]) +
            N("Сургуульд хамрагдахдаа хүйсийн том ялгаа харагдахгүй байна."),
        ],
        [
          "2 · Боловсрол",
          "<h2>Цэцэрлэгт <em>хэд</em> хамрагддаг вэ?</h2>" +
            G([
              ["51", "цэцэрлэг байна"],
              ["10,251", "хүүхэд цэцэрлэгт явдаг"],
            ]),
        ],
        [
          "2 · Боловсрол",
          "<h2>Боловсролын тэгш бус байдал гэдэг нь <em>юу вэ?</em></h2>" +
            L([
              "Сургууль, цэцэрлэгт орох боломж хүн бүрд адил эсэх",
              "Сургууль болгонд багш, орчин, нөхцөл адилхан сайн эсэх",
              "Сурсныхаа дараа ажил, орлого олох боломж адил эсэх",
            ]),
        ],
        [
          "2 · Боловсрол",
          "<h2>Тоо <em>бүх зүйлийг</em> хэлдэггүй</h2>" +
            L([
              "Хичээлийн чанар",
              "Сургуулийн байршил, ангид хэдэн хүүхэд байгаа",
              "Гэр бүлийн орлого",
              "Нэмэлт хичээл, дугуйланд явах боломж",
            ]) +
            Q(
              "Хүүхдэд адил боловсрол өгөх нь тэдний ирээдүйн ажил, орлогын эхлэл болдог.",
            ),
        ],
        [
          "2 · Боловсрол",
          "<h2>Хүүхдийн сурахад юу <em>саад</em> болдог вэ?</h2>" +
            G([
              ["01", "Гэр бүлийн орлого, сургуулийн нэмэлт зардал"],
              ["02", "Сургууль хол байх, анги дүүрэн байх"],
              ["03", "Хөгжлийн бэрхшээлтэй хүүхдэд тохирсон орчин дутмаг байх"],
              ["04", "Компьютер, интернэтгүй байх"],
            ]),
        ],
        [
          "3 · Эрүүл мэнд",
          "<h2>Эмнэлгийн үйлчилгээ хүн бүрт <em>хүрч</em> байна уу?</h2>" +
            G([
              ["01", "Хол байх: эмнэлэгт очих зам, тээвэр"],
              ["02", "Төлбөр: үзлэг, шинжилгээ, эмийн зардал"],
              ["03", "Дараалал: эмч хүрэлцэх эсэх, удаан хүлээх"],
              ["04", "Мэдээлэл: өвчнөөс урьдчилан сэргийлэхийг мэдэх"],
            ]),
        ],
        [
          "3 · Эрүүл мэнд",
          "<h2>Тэгш бус байдал <em>юугаар</em> харагддаг вэ?</h2>" +
            L([
              "Орлого багатай өрх эмчид үзүүлэхээ хойшлуулж болно",
              "Хүн бүр урьдчилан сэргийлэх үзлэгт адил хамрагддаггүй байж болно",
              "Эмнэлэг дүүрэн, дараалал урт бол үйлчилгээний чанар буурна",
              "Өвдсөн хүн сургууль, ажилдаа тогтмол явж чадахгүй",
            ]) +
            N(
              "Эдгээр нь бидний таамаглал. Дүүргийн эрүүл мэндийн статистикаар баталгаажуулах хэрэгтэй.",
            ),
        ],
        [
          "3 · Эрүүл мэнд",
          "<h2>Хэнд хамгийн <em>хэцүү</em> вэ?</h2>" +
            G([
              ["55+", "Өндөр настан. Байнга эмчид үзүүлэх шаардлагатай"],
              ["0–14", "Хүүхэд. Вакцин, өсөлтийн хяналт хэрэгтэй"],
              ["♿", "Хөгжлийн бэрхшээлтэй хүн. Эмнэлэгт хүрэх, орох хэцүү"],
              ["₮", "Орлого багатай өрх. Төлбөр нь хамгийн том саад"],
            ]),
        ],
        [
          "4 · Хөдөлмөр",
          "<h2>Ажиллах хүчинд <em>оролцох</em> байдал</h2>" +
            G([
              ["53.7%", "дүүргийн нийт хүн ам"],
              ["59.0%", "эрэгтэй"],
              ["48.8%", "эмэгтэй"],
            ]) +
            N("Эх сурвалж: 2020 оны Хүн ам, орон сууцны тооллого."),
        ],
        [
          "4 · Хөдөлмөр",
          "<h2>Эрэгтэй, эмэгтэйн хооронд <em>10.2</em> нэгж хувийн зөрүү байна</h2>" +
            B(
              [
                ["Эрэгтэй", 59, "59.0%"],
                ["Эмэгтэй", 48.8, "48.8%", 1],
              ],
              60,
              1,
            ),
        ],
        [
          "4 · Хөдөлмөр",
          "<h2>Ажил хийдэггүй, ажил хайдаггүй <em>хүн</em></h2>" +
            B(
              [
                ["Нийт", 46.3, "46.3%"],
                ["Эрэгтэй", 41, "41.0%"],
                ["Эмэгтэй", 51.2, "51.2%", 1],
              ],
              60,
              1,
            ),
        ],
        [
          "4 · Хөдөлмөр",
          "<h2>Яагаад ийм зөрүү <em>гарч</em> байна вэ?</h2>" +
            G([
              ["01", "Сурч байгаа"],
              ["02", "Хүүхэд асрах ажил"],
              ["03", "Гэр бүлийн нөхцөл"],
              ["04", "Ажлын байрны бүтэц"],
            ]) +
            N("Эдгээр нь боломжит тайлбар. Бид баталгаажуулаагүй."),
        ],
        [
          "5 · Орлого",
          '<h2>Үнэ <em>8.0%</em>-иар өссөн</h2><p class="sub">2024 оны 5-р сарын байдлаар өмнөх оны мөн үеэс хэрэглээний бараа, үйлчилгээний үнэ ийм хэмжээгээр өссөн.</p>' +
            Q("Орлого багатай өрхөд үүний дарамт илүү мэдрэгдэнэ."),
        ],
        [
          "5 · Орлого",
          '<h2><em>Equality</em> ба Equity</h2><div class="g"><div class="c"><b style="color:var(--mut)">=</b><span><strong>Equality.</strong> Хүн бүрт яг адилхан зүйл өгнө.</span></div><div class="c" style="border-color:var(--ac)"><b>≠</b><span><strong>Equity.</strong> Хүнд хэрэгтэй зүйлийг нь өгч, бүгдийг адил боломжтой болгоно. Жишээ нь орлого багатай өрхийн хүүхдэд сургалтын тусламж, өндөр настанд гэрээр үзлэг хийх.</span></div></div>',
        ],
        [
          "6 · Дүгнэлт",
          "<h2>Тоо <em>тэнцүү</em>, харин боломж?</h2>" +
            L([
              "Хүйсийн харьцаа 49:51, ЕБС-д охид хөвгүүд бараг адил хамрагдаж байна",

      var m = document.getElementById("m"),

        var d = document.createElement("section");
        d.className = "s";
        d.innerHTML = s[1];
        m.appendChild(d);
      });
      var D = m.children;
      function go(n) {
        i = Math.max(0, Math.min(S.length - 1, n));
        for (var j = 0; j < D.length; j++) D[j].classList.toggle("on", j == i);
        document.getElementById("k").textContent = S[i][0];
        document.getElementById("n").textContent =
          ("0" + (i + 1)).slice(-2) + " / " + S.length;
        document.getElementById("pg").style.width =
          ((i + 1) / S.length) * 100 + "%";
        setTimeout(function () {
          D[i].querySelectorAll("[data-w]").forEach(function (e) {
            e.style.width = e.dataset.w + "%";
          });
        }, 60);
        try {
          history.replaceState(null, "", "#" + (i + 1));
        } catch (e) {}
      }
      function tryEndSound() {
        var v = document.getElementById("endVideo");
        if (!v) return;
        v.muted = false;
        v.volume = 1;
        var p = v.play();
        if (p && p.catch)
          p.catch(function () {
            v.muted = true;
            v.play();
          });
      }
      document.getElementById("pv").onclick = function () {
        go(i - 1);
        tryEndSound();
      };
      document.getElementById("nx").onclick = function () {
        go(i + 1);
        tryEndSound();
      };
      document.addEventListener("keydown", function (e) {
        if (e.key == "ArrowRight" || e.key == " " || e.key == "PageDown") {
          e.preventDefault();
          go(i + 1);
        }
        if (e.key == "ArrowLeft" || e.key == "PageUp") go(i - 1);
      });
      var x0 = null;
      m.addEventListener("touchstart", function (e) {
        x0 = e.touches[0].clientX;
      });
      m.addEventListener("touchend", function (e) {
        if (x0 === null) return;
        var d = e.changedTouches[0].clientX - x0;
        if (Math.abs(d) > 60) go(i + (d < 0 ? 1 : -1));
        x0 = null;
      });
      go((parseInt(location.hash.slice(1)) || 1) - 1);
    </script>
